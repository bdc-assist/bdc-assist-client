<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Source icons</title>
<!-- Design scratch page, not part of the app build. Open via the dev server:
     npm run dev, then /design/source-icons.html. The icons are the app's own (lucide-react);
     the list copies SOURCE_TYPES in src/components/bdc/source-types.ts: keep the two in step. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 24px 48px; background: #ffffff; color: #0a0a0a;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 6px; }
  .muted { color: #737373; font-size: 13px; }
  code { font-size: 12px; }
  .themes { display: flex; flex-wrap: wrap; gap: 16px; }
  /* a light and a dark panel, coloured like the app's message footer */
  .panel { --fg: #0a0a0a; --muted: #737373; --hover: #f5f5f5; --line: #e5e5e5;
    background: #ffffff; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; flex: 1 1 420px; min-width: 0; }
  .panel.dark { --fg: #fafafa; --muted: #a1a1a1; --hover: #262626; --line: #262626; background: #0a0a0a; }
  .panel h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 500; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; }
  /* as the app draws them: a 24px-high button, a 16px icon, a count for 2+, a chevron (every type
     opens a list, even of one); less padding on the right, where the chevron has its own; muted until hovered */
  .group { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 2px 0 4px; border-radius: 6px;
    color: var(--muted); font-size: 12px; }
  .group:hover { color: var(--fg); background: var(--hover); }
  .big { color: var(--fg); }
  .row { display: flex; gap: 2px; align-items: center; justify-content: flex-end; padding: 6px 0; }
  .note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Source icons</h1>
<p class="muted">Every icon the source row under an answer uses (<code>SOURCE_TYPES</code> in source-types.ts), at the
  app's size and enlarged, in light and dark. Hover to see the hover state.</p>
<div id="root"></div>

<script type="module">
import { createElement as h, Fragment } from 'react'
import { createRoot } from 'react-dom/client'
import {
  BadgeCheckIcon, BookCopyIcon, BookMarkedIcon, BookOpenIcon, BookOpenTextIcon, BookTextIcon, CalendarDaysIcon,
  ChevronDownIcon, CircleHelpIcon, CirclePlayIcon, DatabaseIcon, FileTextIcon, GlobeIcon, GraduationCapIcon, LibraryBigIcon,
  LibraryIcon, MicroscopeIcon, NewspaperIcon, NotebookTextIcon, ScrollTextIcon,
  TextQuoteIcon, UserRoundIcon,
} from 'lucide-react'

// as SOURCE_TYPES (and OTHER_SOURCE, for a type the app doesn't know), in its order
const TYPES = [
  ['page', 'BDC website', 'BDC website pages', GlobeIcon, 'GlobeIcon'],
  ['docs', 'Documentation', 'Documentation', BookOpenIcon, 'BookOpenIcon'],
  ['faq', 'FAQ', 'FAQs', CircleHelpIcon, 'CircleHelpIcon'],
  ['video', 'Video', 'Videos', CirclePlayIcon, 'CirclePlayIcon'],
  ['event', 'Event', 'Events', CalendarDaysIcon, 'CalendarDaysIcon'],
  ['update', 'Update', 'Updates', NewspaperIcon, 'NewspaperIcon'],
  ['fellow', 'Fellow', 'Fellows', UserRoundIcon, 'UserRoundIcon'],
  ['dbgap-study', 'dbGaP study', 'dbGaP studies', DatabaseIcon, 'DatabaseIcon'],
  ['predefined', 'Predefined response', 'Predefined responses', BadgeCheckIcon, 'BadgeCheckIcon'],
  ['publication', 'Publication', 'Publications', BookMarkedIcon, 'BookMarkedIcon'],
  ['(any other)', 'Source', 'Sources', FileTextIcon, 'FileTextIcon'],
]

// candidates for `publication` (sources.artie: published papers that used BDC, from artie-mcp;
// up to 3 per answer). Predefined was settled 2026-10-16 (BadgeCheckIcon).
const CANDIDATES = [
  [BookMarkedIcon, 'BookMarkedIcon', 'chosen: a book with a bookmark, a reference'],
  [ScrollTextIcon, 'ScrollTextIcon', 'a paper / manuscript; distinct from every current icon'],
  [BookOpenTextIcon, 'BookOpenTextIcon', 'an open book with text; close to Documentation (BookOpenIcon)'],
  [BookTextIcon, 'BookTextIcon', 'a closed book; close to Documentation'],
  [NotebookTextIcon, 'NotebookTextIcon', 'a journal / notebook'],
  [LibraryIcon, 'LibraryIcon', 'books on a shelf: the literature'],
  [LibraryBigIcon, 'LibraryBigIcon', 'bigger shelf; reads well as a group'],
  [BookCopyIcon, 'BookCopyIcon', 'stacked books; plural-looking even for one'],
  [GraduationCapIcon, 'GraduationCapIcon', 'academic; also reads as "training/education"'],
  [MicroscopeIcon, 'MicroscopeIcon', 'research; but says science, not paper'],
  [TextQuoteIcon, 'TextQuoteIcon', 'a citation; abstract, may read as "quote"'],
  [NewspaperIcon, 'NewspaperIcon', 'taken: Update'],
]

const group = (Icon, n, title) =>
  h('span', { className: 'group', title }, h(Icon, { size: 16 }), n > 1 && n, h(ChevronDownIcon, { size: 12 }))
const small = (Icon, title) => group(Icon, 1, title)

function Panel({ dark }) {
  return h('div', { className: `panel${dark ? ' dark' : ''}` },
    h('h3', null, dark ? 'Dark' : 'Light'),
    h('table', null,
      h('thead', null, h('tr', null, ['Type', 'Label', 'One', 'Several', 'Enlarged', 'Lucide'].map((t) => h('th', { key: t }, t)))),
      h('tbody', null, TYPES.map(([key, label, many, Icon, name]) =>
        h('tr', { key },
          h('td', null, h('code', null, key)),
          h('td', null, label),
          h('td', null, small(Icon, label)),
          h('td', null, group(Icon, 3, many)),
          h('td', null, h(Icon, { size: 32, className: 'big', strokeWidth: 1.5 })),
          h('td', null, h('code', null, name)),
        ))),
    ),
    // a row as it sits under an answer: docs, a predefined response, then publications and studies (last)
    h('h3', { style: { marginTop: 14 } }, 'A row as under an answer'),
    h('div', { className: 'row' },
      small(BookOpenIcon, 'Documentation'),
      small(CircleHelpIcon, 'FAQ'),
      small(BadgeCheckIcon, 'Predefined response'),
      group(BookMarkedIcon, 3, 'Publications'),
      group(DatabaseIcon, 12, 'dbGaP studies'),
    ),
  )
}

// each candidate in a message's footer: the toolbar (copy just clicked: a check) on the
// left, the source row on the right, as the app lays them out
function Candidates({ dark }) {
  return h('div', { className: `panel${dark ? ' dark' : ''}` },
    h('h3', null, dark ? 'Dark' : 'Light'),
    h('table', null,
      h('thead', null, h('tr', null, ['Lucide', 'Enlarged', 'One paper', 'Three papers (a group)'].map((t) => h('th', { key: t }, t)))),
      h('tbody', null, CANDIDATES.map(([Icon, name, note]) =>
        h('tr', { key: name },
          h('td', null, h('code', null, name), h('div', { className: 'note' }, note)),
          h('td', null, h(Icon, { size: 32, className: 'big', strokeWidth: 1.5 })),
          // the source row as under an answer: docs, a page, then papers beside the studies
          h('td', null, h('div', { className: 'row' },
            small(BookOpenIcon, 'Documentation'),
            small(GlobeIcon, 'BDC website'),
            small(Icon, 'Publication'),
            group(DatabaseIcon, 12, 'dbGaP studies'),
          )),
          h('td', null, h('div', { className: 'row' },
            small(BookOpenIcon, 'Documentation'),
            small(NewspaperIcon, 'Update'),
            group(Icon, 3, 'Publications'),
            group(DatabaseIcon, 12, 'dbGaP studies'),
          )),
        ))),
    ),
  )
}

createRoot(document.getElementById('root')).render(
  h(Fragment, null,
    h('h2', null, 'Candidates for a related publication'),
    h('p', { className: 'muted' }, 'Papers that used BDC, from artie-mcp (sources.artie, type "publication"): up to 3 per answer, '
      + 'shown just left of the dbGaP studies. The row puts it beside Documentation (BookOpenIcon) and Update '
      + '(NewspaperIcon), the two it could be confused with.'),
    h('div', { className: 'themes' }, h(Candidates, { dark: false }), h(Candidates, { dark: true })),
    h('h2', null, 'All types'),
    h('div', { className: 'themes' }, h(Panel, { dark: false }), h(Panel, { dark: true })),
  ),
)
</script>
</body>
</html>
